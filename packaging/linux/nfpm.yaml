name: pcbcraft
arch: amd64
platform: linux
version: ${PCBCRAFT_PACKAGE_VERSION}
version_schema: semver
release: ${PCBCRAFT_PACKAGE_RELEASE}
section: electronics
priority: optional
maintainer: PCBcraft contributors
homepage: https://github.com/tangency-labs/pcbcraft
license: MIT OR Apache-2.0
description: |
  PCBcraft electronic design editor and command-line tools.

# Windowing and graphics libraries are loaded at runtime.
overrides:
  deb:
    depends:
      - libc6 (>= ${PCBCRAFT_GLIBC_MIN})
      - libgcc-s1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libwayland-client0
      - libx11-6
      - libx11-xcb1
      - libxcb1
      - libxcursor1
      - libxi6
      - libvulkan1 | libegl1
    recommends:
      - mesa-vulkan-drivers
      - libegl-mesa0
      - xdg-desktop-portal
  rpm:
    depends:
      - glibc >= ${PCBCRAFT_GLIBC_MIN}
      - libgcc_s.so.1()(64bit)
      - libxkbcommon.so.0()(64bit)
      - libxkbcommon-x11.so.0()(64bit)
      - libwayland-client.so.0()(64bit)
      - libX11.so.6()(64bit)
      - libX11-xcb.so.1()(64bit)
      - libxcb.so.1()(64bit)
      - libXcursor.so.1()(64bit)
      - libXi.so.6()(64bit)
      - (libvulkan.so.1()(64bit) or libEGL.so.1()(64bit))
    recommends:
      - mesa-vulkan-drivers
      - xdg-desktop-portal

contents:
  - src: ${PCBCRAFT_PACKAGE_BIN}/pcbcraft
    dst: /usr/bin/pcbcraft
    expand: true
    file_info: { mode: 0755 }
  - src: ${PCBCRAFT_PACKAGE_BIN}/pcbcraft-cli
    dst: /usr/bin/pcbcraft-cli
    expand: true
    file_info: { mode: 0755 }
  - src: ${PCBCRAFT_PACKAGE_RESOURCES}/
    dst: /usr/share/doc/pcbcraft/
    expand: true
    type: tree
  - src: packaging/linux/io.tangencylabs.pcbcraft.desktop
    dst: /usr/share/applications/io.tangencylabs.pcbcraft.desktop
    file_info: { mode: 0644 }
