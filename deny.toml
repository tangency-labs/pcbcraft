# `cargo deny check`. Run in CI, so a dependency under a license not listed here fails the build.
# GPL, LGPL and AGPL are not listed and must never be (see AGENTS.md). A package offering one of them
# only as an alternative, like `Apache-2.0 OR GPL-2.0-only`, passes on its permissive option.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# Mozilla's root certificate list, as data, for HTTPS to the Assistant's model endpoints
# (through rustls-platform-verifier). SolidCraft ships the same crate. Only this crate may use it.
[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

# Local official Tangency Labs migration, explicitly authorized by the task owner.
# Keep the actual Brand and Interface licence distinct from PCBcraft's MIT/Apache code.
# The external written-permission record is tracked in SolidCraft issue #14690.
[[licenses.exceptions]]
name = "solidcraft-ui-kit"
version = "=0.40.0-rc.3"
allow = ["LicenseRef-SolidCraft-Brand-and-Interface"]

[[licenses.exceptions]]
name = "solidcraft-theme"
version = "=0.40.0-rc.3"
allow = ["LicenseRef-SolidCraft-Brand-and-Interface"]

[[licenses.exceptions]]
name = "solidcraft-look"
version = "=0.40.0-rc.3"
allow = ["LicenseRef-SolidCraft-Brand-and-Interface"]

[[licenses.clarify]]
name = "solidcraft-ui-kit"
version = "=0.40.0-rc.3"
expression = "LicenseRef-SolidCraft-Brand-and-Interface"
license-files = [{ path = "LICENSE", hash = 0x4b91093f }]

[[licenses.clarify]]
name = "solidcraft-theme"
version = "=0.40.0-rc.3"
expression = "LicenseRef-SolidCraft-Brand-and-Interface"
license-files = [{ path = "LICENSE", hash = 0x4b91093f }]

[[licenses.clarify]]
name = "solidcraft-look"
version = "=0.40.0-rc.3"
expression = "LicenseRef-SolidCraft-Brand-and-Interface AND OFL-1.1"
license-files = [{ path = "LICENSE", hash = 0x4b91093f }]

[licenses.private]
ignore = true

[advisories]
unmaintained = "workspace"
yanked = "warn"

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/tangency-labs/solidcraft.git"]
