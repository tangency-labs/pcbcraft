[package]
name = "pcbcraft-app"
description = "The PCBCraft window, shared by the desktop and browser builds"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
pcbcraft-chrome = { workspace = true }
pcbcraft-engine = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft-agents = { path = "../craft-agents" }
# Model endpoints in the Assistant, as SolidCraft's agent chat does: HTTPS with rustls and the
# operating system's certificates, and API keys in the system keychain (Keychain on macOS,
# Credential Manager on Windows, the Secret Service over pure-Rust D-Bus elsewhere).
ureq = { version = "=3.4.2", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }
craft-control = { path = "../craft-control" }
pcbcraft-mcp = { workspace = true }
eframe = { workspace = true, features = ["wayland", "x11"] }
rfd = "=0.17.2"
tempfile = "=3.27.0"
pcbcraft-storage = { workspace = true }
# Windows `std::fs::canonicalize` returns `\\?\C:\…` paths. dunce gives the plain `C:\…` form when
# Windows reads it as the same path, so Recent projects show the path people chose (#154).
dunce = "=1.0.5"

[dev-dependencies]
winit = { version = "=0.30.13", default-features = false, features = ["wayland"] }
egui_kittest = { workspace = true, features = ["eframe"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
