[package]
name = "pcbcraft-app"
description = "The PCBCraft window, shared by the desktop and browser builds"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
pcbcraft-chrome = { workspace = true }
pcbcraft-engine = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft-control = { path = "../craft-control" }
pcbcraft-mcp = { workspace = true }
eframe = { workspace = true, features = ["wayland", "x11"] }
rfd = "=0.17.2"
tempfile = "=3.27.0"
pcbcraft-storage = { workspace = true }

[dev-dependencies]
egui_kittest = { workspace = true, features = ["eframe"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
