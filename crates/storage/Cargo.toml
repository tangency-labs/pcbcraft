[package]
name = "pcbcraft-storage"
description = "Native project folder I/O and recoverable saves, shared by desktop and CLI"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
pcbcraft-engine = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "=0.10.9"
tempfile = "=3.27.0"
# Windows `std::fs::canonicalize` returns `\\?\C:\…` paths. dunce removes that prefix where safe, so
# Recent projects and CLI errors show the plain `C:\…` path people chose (#154).
dunce = "=1.0.5"

[target.'cfg(unix)'.dependencies]
# Already-qualified transitive dependency; safe descriptor-relative filesystem operations.
rustix = { version = "=1.1.6", features = ["fs"] }
