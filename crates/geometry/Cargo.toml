[package]
name = "pcbcraft-geometry"
description = "Solid bodies and STEP exchange behind a kernel-neutral API, implemented with SolidCraft's solidcore kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
log = { workspace = true }
pcbcraft-units = { workspace = true }

[features]
# Opt in to the kernel on wasm32. Browser builds leave it off: panics abort by default on
# wasm32 and cannot then be caught. Native builds always have the kernel (docs/geometry-kernel.md).
wasm-kernel = ["dep:solidcore-ops", "dep:solidcore-record", "dep:solidcore-step"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
solidcore-ops = { workspace = true }
solidcore-record = { workspace = true }
solidcore-step = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
solidcore-ops = { workspace = true, optional = true }
solidcore-record = { workspace = true, optional = true }
solidcore-step = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }

# Prints its timings and memory instead of using the test harness.
[[test]]
name = "step_board"
harness = false
