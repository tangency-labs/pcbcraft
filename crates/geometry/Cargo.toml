[package]
name = "pcbcraft-geometry"
description = "Planar regions, solid bodies and STEP exchange behind a kernel-neutral SolidCore adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
pcbcraft-units = { workspace = true }
solidcore = { workspace = true }
solidcore-convert = { workspace = true }
solidcore-record = { workspace = true }
solidcore-tess = { workspace = true }

[features]
# Enable 3D and STEP on wasm32 for qualification. Browser fills use the planar adapter.
wasm-kernel = ["dep:solidcore-ops", "dep:solidcore-step"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
solidcore-ops = { workspace = true }
solidcore-step = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
solidcore-ops = { workspace = true, optional = true }
solidcore-step = { workspace = true, optional = true }

# Prints its timings and memory instead of using the test harness.
[[test]]
name = "step_board"
harness = false
