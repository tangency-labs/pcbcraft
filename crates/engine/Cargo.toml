[package]
name = "pcbcraft-engine"
description = "PCBCraft's session and command set: every change a person or an agent makes goes through here"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
pcbcraft-units = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
sha2 = "=0.10.9"
zip = { version = "=9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
getrandom = "=0.3.4"
uuid = { version = "=1.29.0", features = ["serde"] }
# Immutable packed index selected by the #244 bounds comparison.
geo-index = { version = "=0.4.0", default-features = false }

[dev-dependencies]
# Alternative implementation retained only for the reproducible comparison.
rstar = { version = "=0.14.0", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "=0.3.4", features = ["wasm_js"] }
