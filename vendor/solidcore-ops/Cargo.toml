[package]
name = "solidcore-ops"
description = "The modelling operations applications built on solidcore call: each a sequence of kernel calls, converting through solidcore-convert, computing no geometry of its own"
edition = "2021"
license = "Apache-2.0"
version = "0.1.0"
publish = false
# solidcore-record needs Rust 1.88 (edition 2024 let chains).
rust-version = "1.88"
repository = "https://github.com/tangency-labs/solidcore"
keywords = ["cad", "brep", "nurbs", "modelling"]
categories = ["science"]

# Layers §3: ops sits on the kernel, the record and the conversion only.
[dependencies]
solidcore = { git = "https://github.com/tangency-labs/solidcraft.git", rev = "73bdb6cdd39efc3899fb54e7217289a630a89efe" }
solidcore-record = { git = "https://github.com/tangency-labs/solidcraft.git", rev = "73bdb6cdd39efc3899fb54e7217289a630a89efe" }
solidcore-convert = { git = "https://github.com/tangency-labs/solidcraft.git", rev = "73bdb6cdd39efc3899fb54e7217289a630a89efe" }

[features]
# Each ops call's kernel profile (`session::profiled`): the kernel's profiler (solidcore's
# `profile` feature), scoped per call. Off by default: without it ops has no profiling code.
profile = ["solidcore/profile"]

# The kernel rig corpus's entries are JSON, their records gzip: read by its runner
# (tests/kernel_cases.rs) and by the unit tests' corpus cases (src/test_corpus.rs).
[dev-dependencies]
flate2 = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "allow"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Library code must not abort on input-derived data: return SolidError instead.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# Eager `ok_or(SolidError::unported(..))` built every error on every call (batch 50b).
or_fun_call = "warn"
# Justified pedantic allows (port fidelity):
# - upstream compares doubles exactly (e.g. against SM_UNDEF_DOUBLE); keep its semantics
float_cmp = "allow"
# - upstream math uses u, v, w, i, j, k, dU, dV ... naming; renaming hurts traceability
many_single_char_names = "allow"
similar_names = "allow"
# - upstream constants are copied digit-for-digit
unreadable_literal = "allow"
excessive_precision = "allow"
# - integer/float conversions are pervasive in ported index/knot arithmetic
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
# - ported functions keep upstream structure, which is often long
too_many_lines = "allow"
too_many_arguments = "allow"
# - suggests f64::midpoint, which changes numerics vs upstream (a+b)/2
manual_midpoint = "allow"
# - every fallible fn returns SolidError; a per-fn "# Errors" section is noise
missing_errors_doc = "allow"
# - modules mirror upstream names (nurbs::NurbsCurve etc.)
module_name_repetitions = "allow"
# - thousands of ported getters; #[must_use] is added deliberately where it matters
must_use_candidate = "allow"
# - (Rust 1.99) tests assert emptiness with `assert!(x.is_empty())`; `assert_eq!(x, [])` needs
#   Debug + PartialEq on every element type and changes no behaviour
assert_is_empty = "allow"
