# Drafts skip builds; ordinary PR pushes run repository checks and a quick compile.
# approved-for-ci runs affected native checks; broad platforms run on main, merge groups and nightly.
name: CI
run-name: "CI: ${{ github.sha }}${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'approved-for-ci' && ' (labels)' || '' }}"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled]
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  # PR pushes supersede their previous run. Main must finish to refresh the caches.
  group: ci-${{ github.event_name }}-${{ github.ref }}${{ github.run_attempt > 1 && format('-rerun-{0}', github.run_id) || '' }}${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'approved-for-ci' && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  TRUNK_VERSION: v0.21.14
  CARGO_DENY_VERSION: 0.20.2

jobs:
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      quick: ${{ steps.select.outputs.quick }}
      native: ${{ steps.select.outputs.native }}
      windows: ${{ steps.select.outputs.windows }}
      windows_full: ${{ steps.select.outputs.windows_full }}
      macos: ${{ steps.select.outputs.macos }}
      web: ${{ steps.select.outputs.web }}
      wasi: ${{ steps.select.outputs.wasi }}
      licenses: ${{ steps.select.outputs.licenses }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - id: select
        run: python -B scripts/ci/policy.py

  documentation-links:
    needs: changes
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -B scripts/check-markdown-links.py

  library-schemas:
    needs: changes
    # Cheap repository/script checks always run, including on documentation-only PRs.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'jsonschema==4.23.0'
      - run: python -B scripts/check-library-schemas.py
      - run: python -B scripts/check-footprint-schemas.py
      - run: python -B -m unittest discover -s scripts -p 'test_*.py'
      - run: node --no-warnings --experimental-vm-modules --test scripts/test-performance-page.cjs scripts/test-rendered-performance-page.cjs
      - run: node scripts/test-native-library-picker.cjs

  quick-compile:
    needs: changes
    if: needs.changes.outputs.quick == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: ${{ vars.CI_BUILD_JOBS || '4' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: ci-profile-v2
          shared-key: linux-native
          cache-workspace-crates: false
          save-if: false
      - run: cargo fmt --all --check
      - run: cargo check --locked --profile ci --workspace

  linux-tests:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: ${{ vars.CI_BUILD_JOBS || '4' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: ci-profile-v2
          shared-key: linux-native
          cache-workspace-crates: false
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      - run: cargo fmt --all --check
      - name: Read command contract baseline
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          snapshot=docs/schemas/command-contracts.json
          git cat-file -e "$BASE_SHA^{commit}"
          if git cat-file -e "$BASE_SHA:$snapshot" 2>/dev/null; then
            baseline="$RUNNER_TEMP/base-command-contracts.json"
            git show "$BASE_SHA:$snapshot" > "$baseline"
            if ! cmp -s "$baseline" "$snapshot"; then
              printf 'PCBCRAFT_COMMAND_CONTRACT_BASE=%s\n' "$baseline" >> "$GITHUB_ENV"
            fi
          else
            echo "No command contract snapshot on the base branch; checking the first snapshot against the catalog in workspace tests."
          fi
      - name: Check affected native packages (full workspace outside PRs)
        run: python -B scripts/ci/native.py
        env:
          CI_MODE: ${{ needs.changes.outputs.mode }}
      - name: Test command-contract workflow baseline
        run: python -B -m unittest discover -s scripts -p 'test_command_contract_workflow.py'

  windows-tests:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: ${{ vars.CI_RUNNER_WINDOWS || 'windows-latest' }}
    timeout-minutes: 75
    env:
      CARGO_BUILD_JOBS: ${{ vars.CI_BUILD_JOBS_WINDOWS || '2' }}
    steps:
      - name: Use Git for Windows checkout line endings
        run: git config --global core.autocrlf true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: ci-profile-v2
          shared-key: windows-native
          cache-workspace-crates: false
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      - run: python -m pip install 'jsonschema==4.23.0'
      - name: Windows script regressions
        run: python -B -m unittest discover -s scripts -p 'test_*.py'
      - name: Windows diagnostic-page regressions
        run: node --no-warnings --experimental-vm-modules --test scripts/test-performance-page.cjs scripts/test-rendered-performance-page.cjs
      - name: Full Windows tests and native-window artifact
        run: python -X utf8 -B scripts/ci/windows.py --artifacts ci-artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-lifecycle
          path: ci-artifacts/
          if-no-files-found: error
          retention-days: 1

  windows-smoke:
    needs: [changes, windows-tests]
    if: needs.changes.outputs.windows == 'true'
    # A real desktop is required for frame presentation, including with a custom build runner.
    runs-on: windows-latest
    timeout-minutes: 5
    env:
      WGPU_BACKEND: dx12
      WGPU_DX12_COMPILER: fxc
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-lifecycle
          path: ci-artifacts
      - run: python -B scripts/ci/window_smoke.py ci-artifacts/native_window_lifecycle.exe

  macos-tests:
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: ${{ vars.CI_RUNNER_MACOS || 'macos-latest' }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: ${{ vars.CI_BUILD_JOBS_MACOS || '2' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: ci-profile-v2
          shared-key: macos-native
          cache-workspace-crates: false
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      - name: Run macOS workspace tests
        run: cargo test --locked --profile ci --workspace

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: ${{ vars.CI_BUILD_JOBS || '4' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: ci-profile-v2
          shared-key: web
          cache-workspace-crates: false
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      - name: Check browser performance diagnostics
        run: cargo check --locked --profile ci -p pcbcraft-app --features performance-harness --example board_perf_web --target wasm32-unknown-unknown
      - name: Check browser geometry without and with the kernel
        run: |
          cargo check --locked --profile ci -p pcbcraft-geometry --target wasm32-unknown-unknown --no-default-features
          cargo check --locked --profile ci -p pcbcraft-geometry --target wasm32-unknown-unknown --no-default-features --features wasm-kernel
      - name: Install trunk
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build the web app
        working-directory: apps/pcbcraft-web
        run: trunk build --release --locked
      - name: Stage the tested site for Pages
        if: ${{ needs.changes.outputs.mode == 'full' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && !github.event.repository.private }}
        # A Pages upload failure is reported by deployment and does not block desktop nightlies.
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  geometry-webassembly:
    needs: changes
    if: needs.changes.outputs.wasi == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: ${{ vars.CI_BUILD_JOBS || '4' }}
      CARGO_TARGET_WASM32_WASIP1_RUNNER: node --no-warnings ${{ github.workspace }}/scripts/wasi-test-runner.cjs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: ci-profile-v2
          shared-key: wasi
          cache-workspace-crates: false
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      - name: Check WASI runner exit status
        run: node --test scripts/test-wasi-test-runner.cjs
      - run: 'cargo test --locked --profile ci -p pcbcraft-engine --target wasm32-wasip1 --lib board:: -- --test-threads=1'
      - run: 'cargo test --locked --profile ci -p pcbcraft-engine --target wasm32-wasip1 --lib net_classes:: -- --test-threads=1'
      - run: 'cargo test --locked --profile ci -p pcbcraft-engine --target wasm32-wasip1 --lib nets:: -- --test-threads=1'
      - run: cargo test --locked --profile ci -p pcbcraft-units --target wasm32-wasip1 --lib -- --test-threads=1
      - run: cargo test --locked --profile ci -p pcbcraft-geometry --target wasm32-wasip1 --lib -- --test-threads=1

  licenses:
    needs: changes
    if: needs.changes.outputs.licenses == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        run: cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked
      - run: cargo deny --locked check licenses sources bans

  checks:
    # Report the selected stage honestly: passing quick feedback is green, not full qualification.
    if: ${{ always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    needs: [changes, documentation-links, library-schemas, quick-compile, linux-tests, windows-tests, windows-smoke, macos-tests, web, geometry-webassembly, licenses]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -B scripts/ci/check.py
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}

  nightly-packages:
    name: Nightly desktop packages
    needs: [changes, checks]
    if: ${{ !cancelled() && needs.checks.result == 'success' && needs.changes.outputs.mode == 'full' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    permissions:
      contents: read
    uses: ./.github/workflows/desktop-preview.yml
    with:
      artifact-prefix: pcbcraft-nightly-${{ github.sha }}
      nightly: true

  nightly-release:
    name: Publish Nightly prerelease
    needs: [nightly-packages]
    if: ${{ !cancelled() && needs.nightly-packages.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: nightly-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: pcbcraft-nightly-${{ github.sha }}-*
          path: packages
      - name: Update the rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/publish-nightly.sh

  pages-deploy:
    # Full CI skips quick-compile, so check the required results explicitly.
    needs: [changes, checks, web]
    if: ${{ !cancelled() && needs.checks.result == 'success' && needs.web.result == 'success' && needs.changes.outputs.mode == 'full' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && !github.event.repository.private }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check current main revision
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_DEPLOY_SHA: ${{ github.sha }}
        run: |
          pages_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [ "$pages_main_sha" = "$PAGES_DEPLOY_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Pages deployment: a newer main revision exists."
          fi
      - uses: actions/configure-pages@v5
        if: steps.revision.outputs.current == 'true'
      - id: deployment
        if: steps.revision.outputs.current == 'true'
        uses: actions/deploy-pages@v4
