<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>PCBCraft</title>
  <meta name="description" content="Electronics design that feels like KiCad, built for people and agents to work on the same board.">
  <meta name="theme-color" content="#272b34">
  <link data-trunk rel="rust" data-bin="pcbcraft-web" data-wasm-opt="z" data-weak-refs />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #272b34; }
    #pcbcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #pcbcraft_loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #dee2e8; font: 14px system-ui, sans-serif; background: #272b34; z-index: 10; }
  </style>
</head>
<body>
  <canvas id="pcbcraft_canvas"></canvas>
  <div id="pcbcraft_loading" role="status">Loading PCBCraft&hellip;</div>
</body>
</html>
