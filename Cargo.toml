[workspace]
resolver = "3"
members = ["apps/*", "crates/*"]
exclude = ["vendor/eframe", "vendor/egui-winit"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
pcbcraft-app = { path = "crates/app" }
pcbcraft-chrome = { path = "crates/chrome" }
pcbcraft-engine = { path = "crates/engine" }
pcbcraft-mcp = { path = "crates/mcp" }
pcbcraft-storage = { path = "crates/storage" }
pcbcraft-units = { path = "crates/units" }
solidcraft-ui-text = { git = "https://github.com/tangency-labs/solidcraft.git", rev = "eeb366c2ff276987a15c043d63b9072b58274703" }
solidcraft-ui-kit = { git = "https://github.com/tangency-labs/solidcraft.git", rev = "eeb366c2ff276987a15c043d63b9072b58274703" }
solidcraft-ui-registry = { git = "https://github.com/tangency-labs/solidcraft.git", rev = "eeb366c2ff276987a15c043d63b9072b58274703" }
solidcraft-theme = { git = "https://github.com/tangency-labs/solidcraft.git", rev = "eeb366c2ff276987a15c043d63b9072b58274703" }
solidcraft-look = { git = "https://github.com/tangency-labs/solidcraft.git", rev = "eeb366c2ff276987a15c043d63b9072b58274703" }
# SolidCraft's B-rep kernel and STEP crates, at the same revision as the UI crates above.
# Only pcbcraft-geometry depends on them (docs/design/geometry-kernel.md).
pcbcraft-geometry = { path = "crates/geometry" }
solidcraft-geom = { git = "https://github.com/tangency-labs/solidcraft.git", rev = "eeb366c2ff276987a15c043d63b9072b58274703" }
solidcraft-gpu = { git = "https://github.com/tangency-labs/solidcraft.git", rev = "eeb366c2ff276987a15c043d63b9072b58274703" }
solidcraft-render = { git = "https://github.com/tangency-labs/solidcraft.git", rev = "eeb366c2ff276987a15c043d63b9072b58274703" }
solidcraft-viewport = { git = "https://github.com/tangency-labs/solidcraft.git", rev = "eeb366c2ff276987a15c043d63b9072b58274703" }
solidcraft-viewport-egui = { git = "https://github.com/tangency-labs/solidcraft.git", rev = "eeb366c2ff276987a15c043d63b9072b58274703" }
solidcraft-viewport-gpu = { git = "https://github.com/tangency-labs/solidcraft.git", rev = "eeb366c2ff276987a15c043d63b9072b58274703" }
solidcore = { git = "https://github.com/tangency-labs/solidcraft.git", rev = "eeb366c2ff276987a15c043d63b9072b58274703" }
solidcore-convert = { git = "https://github.com/tangency-labs/solidcraft.git", rev = "eeb366c2ff276987a15c043d63b9072b58274703" }
solidcore-ops = { git = "https://github.com/tangency-labs/solidcraft.git", rev = "eeb366c2ff276987a15c043d63b9072b58274703" }
solidcore-record = { git = "https://github.com/tangency-labs/solidcraft.git", rev = "eeb366c2ff276987a15c043d63b9072b58274703" }
solidcore-step = { git = "https://github.com/tangency-labs/solidcraft.git", rev = "eeb366c2ff276987a15c043d63b9072b58274703" }
solidcore-tess = { git = "https://github.com/tangency-labs/solidcraft.git", rev = "eeb366c2ff276987a15c043d63b9072b58274703" }
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "persistence", "clipboard"] }
egui = "=0.37.0"
egui_kittest = "=0.37.0"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

# The browser build downloads the whole app, so it is built for size.
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 16

# Routine verification keeps assertion/overflow checks, without full debugger metadata or LTO.
[profile.ci]
inherits = "dev"
opt-level = 1
debug = "line-tables-only"
debug-assertions = true
overflow-checks = true
incremental = false

[profile.ci.package."*"]
opt-level = 2
debug = false

# Local native-root lifetime fix; source and patch boundary are recorded in vendor/eframe/PATCH.md.
[patch.crates-io]
eframe = { path = "vendor/eframe" }

# Empty-clipboard paste-chord completion + test seams; see vendor/egui-winit/PATCH.md.
egui-winit = { path = "vendor/egui-winit" }

# SolidCraft vendors egui with its own fixes; its egui-wgpu and the toolkit build against that copy,
# so the whole egui family comes from the same revision.
ecolor = { git = "https://github.com/tangency-labs/solidcraft.git", rev = "eeb366c2ff276987a15c043d63b9072b58274703" }
egui = { git = "https://github.com/tangency-labs/solidcraft.git", rev = "eeb366c2ff276987a15c043d63b9072b58274703" }
emath = { git = "https://github.com/tangency-labs/solidcraft.git", rev = "eeb366c2ff276987a15c043d63b9072b58274703" }
epaint = { git = "https://github.com/tangency-labs/solidcraft.git", rev = "eeb366c2ff276987a15c043d63b9072b58274703" }
epaint_default_fonts = { git = "https://github.com/tangency-labs/solidcraft.git", rev = "eeb366c2ff276987a15c043d63b9072b58274703" }
# Shared viewport callbacks require SolidCraft's published renderer fixes.
egui-wgpu = { git = "https://github.com/tangency-labs/solidcraft.git", rev = "eeb366c2ff276987a15c043d63b9072b58274703" }
winit = { git = "https://github.com/tangency-labs/solidcraft.git", rev = "eeb366c2ff276987a15c043d63b9072b58274703" }
