[workspace]
resolver = "3"
members = ["apps/*", "crates/*"]
exclude = ["vendor/eframe"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
pcbcraft-app = { path = "crates/app" }
pcbcraft-chrome = { path = "crates/chrome" }
pcbcraft-engine = { path = "crates/engine" }
pcbcraft-mcp = { path = "crates/mcp" }
pcbcraft-storage = { path = "crates/storage" }
solidcraft-ui-kit = { git = "https://github.com/tangency-labs/solidcraft.git", rev = "f56114219b2d7f6d16de8dd58700479646948f8a" }
solidcraft-ui-registry = { git = "https://github.com/tangency-labs/solidcraft.git", rev = "f56114219b2d7f6d16de8dd58700479646948f8a" }
solidcraft-theme = { git = "https://github.com/tangency-labs/solidcraft.git", rev = "f56114219b2d7f6d16de8dd58700479646948f8a" }
solidcraft-look = { git = "https://github.com/tangency-labs/solidcraft.git", rev = "f56114219b2d7f6d16de8dd58700479646948f8a" }
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "persistence", "clipboard"] }
egui = "=0.37.0"
egui_kittest = "=0.37.0"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

# The browser build downloads the whole app, so it is built for size.
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 16

# Local native-root lifetime fix; source and patch boundary are recorded in vendor/eframe/PATCH.md.
[patch.crates-io]
eframe = { path = "vendor/eframe" }

# Shared viewport callbacks require SolidCraft's published renderer fixes.
egui-wgpu = { git = "https://github.com/tangency-labs/solidcraft.git", rev = "f56114219b2d7f6d16de8dd58700479646948f8a" }
winit = { git = "https://github.com/tangency-labs/solidcraft.git", rev = "f56114219b2d7f6d16de8dd58700479646948f8a" }
