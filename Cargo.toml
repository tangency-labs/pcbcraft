[workspace]
resolver = "3"
members = ["apps/*", "crates/*"]
exclude = ["vendor/eframe", "vendor/solidcore-ops"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
pcbcraft-app = { path = "crates/app" }
pcbcraft-chrome = { path = "crates/chrome" }
pcbcraft-engine = { path = "crates/engine" }
pcbcraft-mcp = { path = "crates/mcp" }
pcbcraft-storage = { path = "crates/storage" }
pcbcraft-units = { path = "crates/units" }
solidcraft-ui-text = { git = "https://github.com/tangency-labs/solidcraft.git", rev = "73bdb6cdd39efc3899fb54e7217289a630a89efe" }
solidcraft-ui-kit = { git = "https://github.com/tangency-labs/solidcraft.git", rev = "73bdb6cdd39efc3899fb54e7217289a630a89efe" }
solidcraft-ui-registry = { git = "https://github.com/tangency-labs/solidcraft.git", rev = "73bdb6cdd39efc3899fb54e7217289a630a89efe" }
solidcraft-theme = { git = "https://github.com/tangency-labs/solidcraft.git", rev = "73bdb6cdd39efc3899fb54e7217289a630a89efe" }
solidcraft-look = { git = "https://github.com/tangency-labs/solidcraft.git", rev = "73bdb6cdd39efc3899fb54e7217289a630a89efe" }
# SolidCraft's B-rep kernel and STEP crates, at the same revision as the UI crates above.
# Only pcbcraft-geometry depends on them (docs/geometry-kernel.md).
solidcore-ops = { git = "https://github.com/tangency-labs/solidcraft.git", rev = "73bdb6cdd39efc3899fb54e7217289a630a89efe" }
solidcore-record = { git = "https://github.com/tangency-labs/solidcraft.git", rev = "73bdb6cdd39efc3899fb54e7217289a630a89efe" }
solidcore-step = { git = "https://github.com/tangency-labs/solidcraft.git", rev = "73bdb6cdd39efc3899fb54e7217289a630a89efe" }
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "persistence", "clipboard"] }
egui = "=0.37.0"
egui_kittest = "=0.37.0"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

# The browser build downloads the whole app, so it is built for size.
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 16

# Local native-root lifetime fix; source and patch boundary are recorded in vendor/eframe/PATCH.md.
[patch.crates-io]
eframe = { path = "vendor/eframe" }

# Shared viewport callbacks require SolidCraft's published renderer fixes.
egui-wgpu = { git = "https://github.com/tangency-labs/solidcraft.git", rev = "73bdb6cdd39efc3899fb54e7217289a630a89efe" }
winit = { git = "https://github.com/tangency-labs/solidcraft.git", rev = "73bdb6cdd39efc3899fb54e7217289a630a89efe" }

# Narrow backport of upstream STEP composition fixes; see vendor/solidcore-ops/PATCH.md.
[patch."https://github.com/tangency-labs/solidcraft.git"]
solidcore-ops = { path = "vendor/solidcore-ops" }
