[workspace]
resolver = "3"
members = ["apps/*", "crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
pcbcraft-app = { path = "crates/app" }
pcbcraft-chrome = { path = "crates/chrome" }
pcbcraft-engine = { path = "crates/engine" }
pcbcraft-mcp = { path = "crates/mcp" }
pcbcraft-storage = { path = "crates/storage" }
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "persistence"] }
egui = "=0.36.2"
egui_kittest = "=0.36.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

# The browser build downloads the whole app, so it is built for size.
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 16
